server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Панел ва API аз як origin кор мекунанд: cookie-и сессия бе
    # SameSite-мушкилӣ мерасад ва CORS тамоман лозим намешавад.
    location /api/ {
        proxy_pass http://amiri_api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vision-и чекҳо ва OpenAI вақт мегиранд
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }

    # Webhook-и Telegram зери /api нест — роҳи худро дорад. Бо ҳамин
    # як домени HTTPS ҳам панел, ҳам webhook кор мекунад.
    location /webhook/ {
        proxy_pass http://amiri_api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: ҳар роҳи номаълум ба index.html меравад, вагарна
    # навсозии саҳифа дар /expenses хатои 404 медиҳад
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Файлҳои билд ҳашдор доранд — абадӣ кэш мешаванд
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ҳеҷ гоҳ кэш намешавад, вагарна баъди деплой
    # корбар версияи кӯҳнаро мебинад
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
